<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cycle">
    
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="https://fav.farm/🩸">
    
    <link rel="icon" href="https://fav.farm/🩸">
    <title>Cycle Tracker</title>
    <style>
        :root { 
            --bg-color: #121212; 
            --text-color: #fff; 
            --cell-border: #222; 
            --highlight-red: #cc555533; 
            --blood-color: #cc5555; 
            --blood-dark: #993333; 
            --blood-medium: #cc5555; 
            --blood-light: #e06666; 
            --blood-spotting: #e68080; 
            --predict-color: #ff4d4d22; 
            --predict-text-color: #ff4d4d88; 
            --pill-color: #4da6ff; 
            --faint-text: #666; 
            --accent: #ffffff; 
        }
        
        /* Optimized for full-screen iPhone display */
        body { 
            background-color: var(--bg-color); 
            color: var(--text-color); 
            font-family: -apple-system, sans-serif; 
            margin: 0; 
            overflow: hidden; 
            padding-top: env(safe-area-inset-top); /* Avoids the "Notch" */
        }
        
        .nav-bar { 
            position: fixed; top: 0; width: 100%; height: calc(75px + env(safe-area-inset-top)); 
            background: rgba(18, 18, 18, 0.9); backdrop-filter: blur(15px); 
            display: flex; flex-direction: column; justify-content: flex-end; 
            padding: 0 20px 10px 20px; z-index: 100; box-sizing: border-box; 
            border-bottom: 1px solid var(--cell-border); 
        }
        
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        #prediction-text { font-size: 0.75rem; color: var(--predict-text-color); margin-top: 4px; font-weight: 500; }
        .nav-btns { display: flex; gap: 10px; align-items: center; }
        #jump-btn { background: #fff; color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; font-weight: bold; }
        #settings-btn { font-size: 1.2rem; cursor: pointer; color: #fff; }
        
        #scroll-viewport { height: 100vh; overflow-y: auto; scroll-behavior: auto; padding-top: 20px; -webkit-overflow-scrolling: touch; overflow-anchor: none; }
        .month-container { padding: 10px 15px 40px 15px; max-width: 500px; margin: 0 auto; }
        .month-header { font-size: 1.4rem; font-weight: 700; padding: 20px 0; position: sticky; top: 75px; background: var(--bg-color); z-index: 5; }
        
        .calendar-grid { 
            display: grid; grid-template-columns: repeat(7, 1fr); 
            border-top: 1px solid var(--cell-border); border-left: 1px solid var(--cell-border); 
            background: var(--bg-color); 
        }
        
        .weekday-label { text-align: center; font-size: 0.65rem; color: var(--faint-text); padding: 12px 0; text-transform: uppercase; border-bottom: 1px solid var(--cell-border); border-right: 1px solid var(--cell-border); }
        .day { aspect-ratio: 1 / 1; border-right: 1px solid var(--cell-border); border-bottom: 1px solid var(--cell-border); position: relative; min-height: 50px; }
        .day.is-today { box-shadow: inset 0 0 0 2px var(--accent); z-index: 2; }
        .day.is-predicted { background-color: var(--predict-color); z-index: 1; }
        
        .date-num { position: absolute; top: 8px; left: 10px; font-size: 1rem; color: #fff; }
        .icon-stack { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
        .mini-pixel { width: 7px; height: 7px; border-radius: 50%; }
        
        .pixel-blood-heavy { background-color: var(--blood-dark); }
        .pixel-blood-medium { background-color: var(--blood-medium); }
        .pixel-blood-light { background-color: var(--blood-light); }
        .pixel-blood-spotting { background-color: var(--blood-spotting); }
        
        .pixel-pill { background-color: var(--pill-color); }
        .day.period-active { background-color: var(--highlight-red); }
        
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 200; justify-content: center; align-items: center; }
        .dial { background: #1a1a1a; padding: 25px; border-radius: 28px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #333; width: 280px; }
        .dial-section-title { font-size: 0.8rem; color: #888; text-transform: uppercase; margin-top: 10px; padding-left: 5px; }
        .dial-btn { background: #222; border: 1px solid #444; color: white; padding: 14px; border-radius: 12px; cursor: pointer; text-align: left; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }
        
        .dial-btn.active.flow-heavy { border-color: var(--blood-dark); background: #331a1a88; }
        .dial-btn.active.flow-medium { border-color: var(--blood-medium); background: #331a1a88; }
        .dial-btn.active.flow-light { border-color: var(--blood-light); background: #331a1a88; }
        .dial-btn.active.flow-spotting { border-color: var(--blood-spotting); background: #331a1a88; }
        
        .dial-btn.pill-active { border-color: var(--pill-color); background: #1a2633; }
        input { width: 100%; padding: 12px; background: #222; border: 1px solid #444; color: white; border-radius: 8px; box-sizing: border-box; }
        #bottom-sentinel, #top-sentinel { height: 20px; width: 100%; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div class="nav-content">
        <div style="font-weight: 800; font-size: 1.1rem; color: #fff;">CYCLE TRACKER</div>
        <div class="nav-btns">
            <button id="jump-btn" onclick="jumpToToday()">Today</button>
            <div id="settings-btn" onclick="openSettings()">⚙️</div>
        </div>
    </div>
    <div id="prediction-text">Log flow to see predictions</div>
</div>

<div id="scroll-viewport">
    <div id="top-sentinel"></div>
    <div id="calendar-list"></div>
    <div id="bottom-sentinel"></div>
</div>

<div id="overlay" onclick="handleOverlayClick(event)">
    <div class="dial" id="dial-content" onclick="event.stopPropagation()"></div>
</div>

<script>
    let trackingData = new Map();
    let predictedDates = new Set();
    const today = new Date();
    const todayKey = `${today.getFullYear()}-${today.getMonth()+1}-${today.getDate()}`;
    const calendarList = document.getElementById('calendar-list');
    const viewport = document.getElementById('scroll-viewport');
    
    async function saveData() {
        localStorage.setItem('cycle_tracker_data', JSON.stringify(Object.fromEntries(trackingData)));
        const url = localStorage.getItem('upstash_url');
        const token = localStorage.getItem('upstash_token');
        if (url && token) {
            await fetch(`${url}/set/cycle_data`, {
                method: 'POST',
                headers: { Authorization: `Bearer ${token}` },
                body: JSON.stringify(Object.fromEntries(trackingData))
            });
        }
        refreshAppView();
    }

    async function loadData() {
        const savedLocal = localStorage.getItem('cycle_tracker_data');
        if(savedLocal) trackingData = new Map(Object.entries(JSON.parse(savedLocal)));
        const url = localStorage.getItem('upstash_url');
        const token = localStorage.getItem('upstash_token');
        if (url && token) {
            try {
                const res = await fetch(`${url}/get/cycle_data`, { headers: { Authorization: `Bearer ${token}` } });
                const cloud = await res.json();
                if (cloud.result) trackingData = new Map(Object.entries(JSON.parse(cloud.result)));
            } catch(e) { console.log("Cloud sync failed."); }
        }
        refreshAppView();
    }

    function updatePredictions() {
        predictedDates.clear();
        let flowDates = Array.from(trackingData.keys())
            .filter(k => {
                const d = trackingData.get(k);
                return d.heavy || d.medium || d.light || d.spotting;
            })
            .sort((a,b) => new Date(a) - new Date(b));

        if (flowDates.length === 0) return;

        let lastPeriodStart = new Date(flowDates[flowDates.length - 1]);
        for (let i = flowDates.length - 1; i > 0; i--) {
            let current = new Date(flowDates[i]);
            let previous = new Date(flowDates[i-1]);
            let diff = (current - previous) / (1000 * 60 * 60 * 24);
            if (diff <= 2) lastPeriodStart = previous; else break;
        }

        const cycleLen = parseInt(localStorage.getItem('cycle_length')) || 28;
        for(let c=1; c<=6; c++) {
            let start = new Date(lastPeriodStart); 
            start.setDate(start.getDate() + (cycleLen * c));
            for(let d=0; d<4; d++) {
                let p = new Date(start); p.setDate(p.getDate() + d);
                predictedDates.add(`${p.getFullYear()}-${p.getMonth()+1}-${p.getDate()}`);
            }
            if(c===1) document.getElementById('prediction-text').innerText = `Next period: ~${start.toLocaleDateString(undefined, {month:'short', day:'numeric'})}`;
        }
    }

    function refreshAppView() {
        updatePredictions();
        document.querySelectorAll('.day[data-key]').forEach(day => {
            const k = day.getAttribute('data-key');
            const data = trackingData.get(k) || {};
            const hasFlow = data.heavy || data.medium || data.light || data.spotting;
            let bloodPixelClass = '';
            if (data.heavy) bloodPixelClass = 'pixel-blood-heavy';
            else if (data.medium) bloodPixelClass = 'pixel-blood-medium';
            else if (data.light) bloodPixelClass = 'pixel-blood-light';
            else if (data.spotting) bloodPixelClass = 'pixel-blood-spotting';

            day.innerHTML = `<span class="date-num">${k.split('-')[2]}</span><div class="icon-stack">${hasFlow ? `<div class="mini-pixel ${bloodPixelClass}"></div>` : ''}${data.pill ? '<div class="mini-pixel pixel-pill"></div>' : ''}</div>`;
            day.classList.toggle('is-today', k === todayKey);
            day.classList.toggle('period-active', !!hasFlow);
            day.classList.toggle('is-predicted', predictedDates.has(k));
        });
    }

    function createMonthGrid(dateObj) {
        const year = dateObj.getFullYear(), month = dateObj.getMonth();
        const container = document.createElement('div');
        container.className = 'month-container';
        container.innerHTML = `<div class="month-header">${dateObj.toLocaleString('default', {month:'long', year:'numeric'})}</div>`;
        const grid = document.createElement('div'); grid.className = 'calendar-grid';
        ['S','M','T','W','T','F','S'].forEach(d => grid.innerHTML += `<div class="weekday-label">${d}</div>`);
        const firstDay = new Date(year, month, 1).getDay();
        for(let i=0; i<firstDay; i++) { const spacer = document.createElement('div'); spacer.className = 'day'; grid.appendChild(spacer); }
        const daysInMonth = new Date(year, month+1, 0).getDate();
        for(let d=1; d<=daysInMonth; d++) {
            const key = `${year}-${month+1}-${d}`, day = document.createElement('div');
            day.className = 'day'; day.setAttribute('data-key', key); day.id = `cell-${key}`;
            day.onclick = () => openDial(key); grid.appendChild(day);
        }
        container.appendChild(grid); return container;
    }

    let futureCursor = new Date(today.getFullYear(), today.getMonth(), 1);
    let pastCursor = new Date(today.getFullYear(), today.getMonth(), 1);

    function loadFuture(count = 3) {
        for(let i=0; i<count; i++) {
            calendarList.appendChild(createMonthGrid(new Date(futureCursor)));
            futureCursor.setMonth(futureCursor.getMonth() + 1);
        }
        refreshAppView();
    }

    function loadPast(count = 3) {
        const oldHeight = viewport.scrollHeight;
        const oldScroll = viewport.scrollTop;
        for(let i=0; i<count; i++) {
            pastCursor.setMonth(pastCursor.getMonth() - 1);
            calendarList.prepend(createMonthGrid(new Date(pastCursor)));
        }
        refreshAppView();
        viewport.scrollTop = oldScroll + (viewport.scrollHeight - oldHeight);
    }

    function openDial(k) {
        const d = trackingData.get(k) || {};
        window.selectedK = k;
        document.getElementById('dial-content').innerHTML = `
            <div class="dial-section-title">${new Date(k).toLocaleDateString(undefined, {month:'short', day:'numeric'})}</div>
            ${['heavy','medium','light','spotting'].map(t => {
                let c = t==='heavy'?'flow-heavy':t==='medium'?'flow-medium':t==='light'?'flow-light':'flow-spotting';
                return `<button class="dial-btn ${d[t]?'active':''} ${c}" onclick="toggleData('${t}')">${t.charAt(0).toUpperCase()+t.slice(1)} ${d[t]?'✓':''}</button>`;
            }).join('')}
            <div class="dial-section-title">Medication</div>
            <button class="dial-btn ${d.pill?'pill-active':''}" onclick="toggleData('pill')">💊 Birth Control ${d.pill?'✓':''}</button>
            <button class="dial-btn" style="background:transparent; border:none; color:#888; justify-content:center;" onclick="closeDial()">Dismiss</button>
        `;
        document.getElementById('overlay').style.display = 'flex';
    }

    function openSettings() {
        document.getElementById('dial-content').innerHTML = `
            <h3>Sync & Cycle</h3>
            <input id="in-url" placeholder="Upstash REST URL" value="${localStorage.getItem('upstash_url')||''}">
            <input id="in-token" placeholder="Upstash Token" value="${localStorage.getItem('upstash_token')||''}">
            <input id="in-cycle" type="number" placeholder="Cycle Length" value="${localStorage.getItem('cycle_length')||'28'}">
            <button onclick="saveSettings()" style="background:#fff; color:#000; border:none; border-radius:8px; font-weight:bold; width:100%; padding:12px; margin-top:10px; cursor:pointer;">Save & Sync</button>
        `;
        document.getElementById('overlay').style.display = 'flex';
    }

    function saveSettings() {
        localStorage.setItem('upstash_url', document.getElementById('in-url').value.trim());
        localStorage.setItem('upstash_token', document.getElementById('in-token').value.trim());
        localStorage.setItem('cycle_length', document.getElementById('in-cycle').value || '28');
        closeDial(); loadData();
    }

    function toggleData(t) {
        let d = trackingData.get(window.selectedK) || {};
        if(['heavy','medium','light','spotting'].includes(t)) {
            const active = d[t]; d.heavy=d.medium=d.light=d.spotting=false; d[t]=!active;
        } else d[t] = !d[t];
        trackingData.set(window.selectedK, d); saveData(); openDial(window.selectedK);
    }

    function handleOverlayClick(e) { if(e.target.id==='overlay') closeDial(); }
    function closeDial() { document.getElementById('overlay').style.display = 'none'; }
    function jumpToToday() { document.getElementById(`cell-${todayKey}`).scrollIntoView({block:'center'}); }

    const observer = new IntersectionObserver(entries => {
        entries.forEach(e => {
            if (e.isIntersecting) {
                if (e.target.id === 'bottom-sentinel') loadFuture(3);
                if (e.target.id === 'top-sentinel') loadPast(3);
            }
        });
    }, { threshold: 0.1 });

    observer.observe(document.getElementById('bottom-sentinel'));
    observer.observe(document.getElementById('top-sentinel'));
    
    loadFuture(1); 
    loadData();
    setTimeout(jumpToToday, 500);
</script>
</body>
</html>
