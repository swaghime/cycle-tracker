<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cycle Tracker</title>
    <style>
        body { background: #000; color: #fff; font-family: -apple-system, sans-serif; margin: 0; }
        .nav-bar { position: fixed; top: 0; width: 100%; height: 60px; background: #111; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; box-sizing: border-box; border-bottom: 1px solid #333; z-index: 100; }
        #grid { display: grid; grid-template-columns: repeat(7, 1fr); padding-top: 60px; }
        .day { aspect-ratio: 1; border: 0.5px solid #333; display: flex; align-items: center; justify-content: center; font-size: 0.9rem; cursor: pointer; }
        .day:hover { background: #222; }
        #overlay { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        .dial { background: #111; padding: 20px; border-radius: 15px; width: 80%; border: 1px solid #444; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #000; color: #fff; border: 1px solid #444; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background: #fff; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div>CYCLE TRACKER</div>
    <div style="cursor:pointer" onclick="document.getElementById('overlay').style.display='flex'">⚙️</div>
</div>

<div id="grid"></div>

<div id="overlay" onclick="this.style.display='none'">
    <div class="dial" onclick="event.stopPropagation()">
        <h3>Sync Settings</h3>
        <input id="in-url" placeholder="Upstash URL">
        <input id="in-token" placeholder="Upstash Token">
        <button onclick="saveSettings()">Save & Sync</button>
    </div>
</div>

<script>
    // Create the full 35-day grid to remove the "gray bar"
    const grid = document.getElementById('grid');
    for(let i=1; i<=35; i++) {
        const d = document.createElement('div');
        d.className = 'day'; 
        d.innerText = i <= 31 ? i : ''; // Only show numbers up to 31
        d.onclick = () => alert('Log data for day ' + i);
        grid.appendChild(d);
    }

    function saveSettings() {
        localStorage.setItem('upstash_url', document.getElementById('in-url').value);
        localStorage.setItem('upstash_token', document.getElementById('in-token').value);
        document.getElementById('overlay').style.display = 'none';
        alert('Settings Saved!');
    }

    // Load saved settings into inputs
    document.getElementById('in-url').value = localStorage.getItem('upstash_url') || '';
    document.getElementById('in-token').value = localStorage.getItem('upstash_token') || '';
</script>
</body>
</html>
