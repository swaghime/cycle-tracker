<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Persistent Cycle Tracker</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --cell-border: #222;
            --highlight-red: #ff4d4d33;
            --blood-color: #ff4d4d;
            --pill-color: #4da6ff;
            --faint-text: #666;
            --accent: #ffffff;
            --predict-color: #ff4d4d88;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, sans-serif; margin: 0; overflow: hidden; }
        .nav-bar { position: fixed; top: 0; width: 100%; height: 70px; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); display: flex; flex-direction: column; justify-content: center; padding: 0 20px; z-index: 100; box-sizing: border-box; border-bottom: 1px solid var(--cell-border); }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        #prediction-text { font-size: 0.75rem; color: var(--blood-color); margin-top: 4px; font-weight: 500; }
        #jump-btn { background: #222; color: #fff; border: 1px solid #444; padding: 6px 12px; border-radius: 8px; font-size: 0.8rem; cursor: pointer; }
        #scroll-viewport { height: 100vh; overflow-y: auto; scroll-behavior: smooth; padding-top: 70px; }
        .month-container { padding: 10px 15px 40px 15px; max-width: 500px; margin: 0 auto; }
        .month-header { font-size: 1.2rem; font-weight: 700; padding: 20px 0; position: sticky; top: 0; background: var(--bg-color); z-index: 5; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--cell-border); border-left: 1px solid var(--cell-border); }
        .weekday-label { text-align: center; font-size: 0.6rem; color: var(--faint-text); padding: 10px 0; text-transform: uppercase; border-bottom: 1px solid var(--cell-border); border-right: 1px solid var(--cell-border); }
        .day { aspect-ratio: 1 / 1; border-right: 1px solid var(--cell-border); border-bottom: 1px solid var(--cell-border); position: relative; cursor: pointer; }
        .day.is-today { box-shadow: inset 0 0 0 1.5px var(--accent); }
        .day.is-predicted { border: 1.5px dashed var(--predict-color); z-index: 1; }
        .date-num { position: absolute; top: 8px; left: 10px; font-size: 0.9rem; }
        .icon-stack { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; gap: 2px; align-items: flex-end; }
        .mini-pixel { width: 5px; height: 5px; border-radius: 1px; }
        .pixel-blood { background-color: var(--blood-color); }
        .pixel-pill { background-color: var(--pill-color); }
        .day.period-active { background-color: var(--highlight-red); }
        #bottom-sentinel, #top-sentinel { height: 120px; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        .dial { background: #111; padding: 30px; border-radius: 28px; display: flex; flex-direction: column; gap: 15px; border: 1px solid #333; width: 240px; }
        .dial-btn { background: #222; border: 1px solid #444; color: white; padding: 16px; border-radius: 14px; cursor: pointer; text-align: left; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div class="nav-content">
        <div style="font-weight: 800; font-size: 1rem;">CYCLE TRACKER</div>
        <button id="jump-btn" onclick="jumpToToday()">Today</button>
    </div>
    <div id="prediction-text">Log a period to start prediction</div>
</div>

<div id="scroll-viewport">
    <div id="top-sentinel"></div>
    <div id="calendar-list"></div>
    <div id="bottom-sentinel"></div>
</div>

<div id="overlay">
    <div class="dial">
        <button class="dial-btn" onclick="toggleData('blood')">🩸 Track Period</button>
        <button class="dial-btn" onclick="toggleData('pill')">💊 Log Birth Control</button>
        <button class="dial-btn" style="background:transparent; border:none; color:#666; text-align:center" onclick="closeDial()">Dismiss</button>
    </div>
</div>

<script>
    const calendarList = document.getElementById('calendar-list');
    const viewport = document.getElementById('scroll-viewport');
    const predictLabel = document.getElementById('prediction-text');
    let trackingData = new Map();
    let predictedDates = new Set();
    let selectedDateKey = null;
    let lastGeneratedMonth = new Date();
    let firstGeneratedMonth = new Date();
    firstGeneratedMonth.setMonth(firstGeneratedMonth.getMonth() - 1);
    const today = new Date();
    const todayKey = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;

    function saveData() {
        localStorage.setItem('cycle_tracker_data', JSON.stringify(Object.fromEntries(trackingData)));
        updatePredictions();
    }

    function loadData() {
        const saved = localStorage.getItem('cycle_tracker_data');
        if (saved) trackingData = new Map(Object.entries(JSON.parse(saved)));
        updatePredictions();
    }

    function updatePredictions() {
        predictedDates.clear();
        let latestPeriodStart = null;
        const sortedDates = Array.from(trackingData.keys()).sort((a, b) => new Date(a) - new Date(b));
        for (let i = 0; i < sortedDates.length; i++) {
            const currentKey = sortedDates[i];
            if (trackingData.get(currentKey).blood) {
                const prevDate = new Date(currentKey);
                prevDate.setDate(prevDate.getDate() - 1);
                const prevKey = `${prevDate.getFullYear()}-${prevDate.getMonth() + 1}-${prevDate.getDate()}`;
                if (!trackingData.has(prevKey) || !trackingData.get(prevKey).blood) latestPeriodStart = new Date(currentKey);
            }
        }
        if (latestPeriodStart) {
            const nextStart = new Date(latestPeriodStart);
            nextStart.setDate(nextStart.getDate() + 28);
            for (let i = 0; i < 5; i++) {
                const p = new Date(nextStart);
                p.setDate(p.getDate() + i);
                predictedDates.add(`${p.getFullYear()}-${p.getMonth() + 1}-${p.getDate()}`);
            }
            predictLabel.innerText = `Next period predicted: ${nextStart.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;
        }
    }

    function createMonthGrid(dateObj) {
        const year = dateObj.getFullYear();
        const month = dateObj.getMonth();
        const container = document.createElement('div');
        container.className = 'month-container';
        container.innerHTML = `<div class="month-header">${dateObj.toLocaleString('default', { month: 'long', year: 'numeric' })}</div>`;
        const grid = document.createElement('div');
        grid.className = 'calendar-grid';
        ['S','M','T','W','T','F','S'].forEach(day => {
            const label = document.createElement('div');
            label.className = 'weekday-label'; label.innerText = day;
            grid.appendChild(label);
        });
        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        for (let i = 0; i < firstDay; i++) grid.appendChild(Object.assign(document.createElement('div'), { className: 'day empty' }));
        for (let d = 1; d <= daysInMonth; d++) {
            const dateKey = `${year}-${month + 1}-${d}`;
            const data = trackingData.get(dateKey) || { blood: false, pill: false };
            const dayDiv = document.createElement('div');
            dayDiv.id = `cell-${dateKey}`;
            dayDiv.className = `day ${data.blood ? 'period-active' : ''} ${dateKey === todayKey ? 'is-today' : ''} ${predictedDates.has(dateKey) ? 'is-predicted' : ''}`;
            dayDiv.onclick = () => openDial(dateKey);
            renderDayContent(dayDiv, d, data);
            grid.appendChild(dayDiv);
        }
        container.appendChild(grid);
        return container;
    }

    function renderDayContent(element, dayNum, data) {
        const dateKey = element.id.replace('cell-', '');
        element.innerHTML = `<span class="date-num">${dayNum}</span><div class="icon-stack">${data.blood ? '<div class="mini-pixel pixel-blood"></div>' : ''}${data.pill ? '<div class="mini-pixel pixel-pill"></div>' : ''}</div>`;
        if(data.blood) element.classList.add('period-active'); else element.classList.remove('period-active');
        if(predictedDates.has(dateKey)) element.classList.add('is-predicted'); else element.classList.remove('is-predicted');
    }

    function loadMore(direction) {
        if (direction === 'future') {
            lastGeneratedMonth.setMonth(lastGeneratedMonth.getMonth() + 1);
            calendarList.appendChild(createMonthGrid(new Date(lastGeneratedMonth)));
        } else {
            const monthEl = createMonthGrid(new Date(firstGeneratedMonth));
            calendarList.prepend(monthEl);
            viewport.scrollTop += monthEl.offsetHeight;
            firstGeneratedMonth.setMonth(firstGeneratedMonth.getMonth() - 1);
        }
    }

    function jumpToToday() {
        const todayCell = document.getElementById(`cell-${todayKey}`);
        if (todayCell) todayCell.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                if (entry.target.id === 'bottom-sentinel') loadMore('future');
                if (entry.target.id === 'top-sentinel') loadMore('past');
            }
        });
    }, { root: viewport, threshold: 0.1 });

    observer.observe(document.getElementById('bottom-sentinel'));
    observer.observe(document.getElementById('top-sentinel'));

    function openDial(dateKey) { selectedDateKey = dateKey; document.getElementById('overlay').style.display = 'flex'; }
    function closeDial() { document.getElementById('overlay').style.display = 'none'; }

    function toggleData(type) {
        const current = trackingData.get(selectedDateKey) || { blood: false, pill: false };
        current[type] = !current[type];
        trackingData.set(selectedDateKey, current);
        saveData();
        document.querySelectorAll('.day').forEach(day => {
            if(day.id.startsWith('cell-')) {
                const k = day.id.replace('cell-', '');
                renderDayContent(day, k.split('-')[2], trackingData.get(k) || {blood:false, pill:false});
            }
        });
        closeDial();
    }

    loadData();
    for(let i=0; i<4; i++) loadMore('future');
    window.onload = () => setTimeout(jumpToToday, 200);
</script>
</body>
</html>
