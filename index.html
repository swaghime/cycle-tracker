<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="icon" href="https://fav.farm/🩸">
    <title>Cycle Tracker</title>
    <style>
        :root { --bg-color: #000; --text-color: #fff; --cell-border: #222; --highlight-red: #ff4d4d33; --blood-color: #ff4d4d; --pill-color: #4da6ff; --faint-text: #666; --accent: #ffffff; --predict-color: #ff4d4d88; }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, sans-serif; margin: 0; overflow: hidden; }
        .nav-bar { position: fixed; top: 0; width: 100%; height: 75px; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px); display: flex; flex-direction: column; justify-content: center; padding: 0 20px; z-index: 100; border-bottom: 1px solid var(--cell-border); }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        #settings-btn { color: #888; font-size: 1.2rem; cursor: pointer; }
        #scroll-viewport { height: 100vh; overflow-y: auto; padding-top: 75px; -webkit-overflow-scrolling: touch; }
        /* ... (Keep previous calendar/dial CSS here for brevity) ... */
        .month-header { font-size: 1.4rem; font-weight: 700; padding: 20px 0; position: sticky; top: 0; background: var(--bg-color); z-index: 5; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--cell-border); border-left: 1px solid var(--cell-border); }
        .day { aspect-ratio: 1 / 1; border-right: 1px solid var(--cell-border); border-bottom: 1px solid var(--cell-border); position: relative; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        .dial { background: #111; padding: 25px; border-radius: 28px; width: 280px; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #222; border: 1px solid #444; color: white; border-radius: 8px; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div class="nav-content">
        <div style="font-weight: 800;">TRACKER</div>
        <div id="settings-btn" onclick="openSettings()">⚙️</div>
    </div>
</div>

<div id="scroll-viewport"><div id="calendar-list"></div></div>
<div id="overlay" onclick="handleOverlayClick(event)">
    <div class="dial" id="dial-content" onclick="event.stopPropagation()"></div>
</div>

<script>
    let trackingData = new Map();
    
    // Cloud Sync Logic
    async function saveData() {
        const url = localStorage.getItem('upstash_url');
        const token = localStorage.getItem('upstash_token');
        if (!url || !token) return;

        const dataString = JSON.stringify(Object.fromEntries(trackingData));
        await fetch(`${url}/set/cycle_data`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: dataString
        });
    }

    async function loadData() {
        const url = localStorage.getItem('upstash_url');
        const token = localStorage.getItem('upstash_token');
        if (!url || !token) return;

        const response = await fetch(`${url}/get/cycle_data`, {
            headers: { Authorization: `Bearer ${token}` }
        });
        const result = await response.json();
        if (result.result) {
            trackingData = new Map(Object.entries(JSON.parse(result.result)));
            refreshAppView();
        }
    }

    function openSettings() {
        document.getElementById('dial-content').innerHTML = `
            <h3>Sync Settings</h3>
            <input id="in-url" placeholder="Upstash REST URL" value="${localStorage.getItem('upstash_url')||''}">
            <input id="in-token" placeholder="Upstash Token" value="${localStorage.getItem('upstash_token')||''}">
            <button onclick="saveSettings()">Save & Sync</button>
        `;
        document.getElementById('overlay').style.display = 'flex';
    }

    function saveSettings() {
        localStorage.setItem('upstash_url', document.getElementById('in-url').value);
        localStorage.setItem('upstash_token', document.getElementById('in-token').value);
        closeDial();
        loadData();
    }

    // ... (Add your previous render/toggle functions here)
    
    loadData();
</script>
</body>
</html>
