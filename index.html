<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cycle Tracker</title>
    <style>
        :root { --bg-color: #000; --text-color: #fff; --cell-border: #222; --blood-color: #ff4d4d; --pill-color: #4da6ff; }
        body { background: var(--bg-color); color: var(--text-color); font-family: -apple-system, sans-serif; margin: 0; }
        .nav-bar { position: fixed; top: 0; width: 100%; height: 75px; background: rgba(0,0,0,0.9); display: flex; justify-content: space-between; align-items: center; padding: 0 20px; z-index: 100; box-sizing: border-box; }
        #scroll-viewport { height: 100vh; overflow-y: auto; padding-top: 75px; }
        .month-container { padding: 10px 15px; }
        .month-header { font-size: 1.4rem; font-weight: 700; padding: 15px 0; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--cell-border); border-left: 1px solid var(--cell-border); }
        .day { aspect-ratio: 1; border-right: 1px solid var(--cell-border); border-bottom: 1px solid var(--cell-border); position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        .dial { background: #111; padding: 25px; border-radius: 20px; width: 85%; max-width: 320px; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #222; color: #fff; border: 1px solid #444; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin-top: 10px; background: #fff; color: #000; border: none; border-radius: 8px; font-weight: bold; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div style="font-weight: 800;">CYCLE TRACKER</div>
    <div onclick="openSettings()" style="font-size: 1.5rem; cursor: pointer;">⚙️</div>
</div>

<div id="scroll-viewport"><div id="calendar-list"></div></div>

<div id="overlay" onclick="this.style.display='none'">
    <div class="dial" id="dial-content" onclick="event.stopPropagation()"></div>
</div>

<script>
    let trackingData = new Map();
    const list = document.getElementById('calendar-list');

    // --- SYNC LOGIC ---
    async function syncToCloud() {
        const url = localStorage.getItem('upstash_url');
        const token = localStorage.getItem('upstash_token');
        if (!url || !token) return;
        await fetch(`${url}/set/cycle_data`, {
            method: 'POST',
            headers: { Authorization: `Bearer ${token}` },
            body: JSON.stringify(Object.fromEntries(trackingData))
        });
    }

    async function loadFromCloud() {
        const url = localStorage.getItem('upstash_url');
        const token = localStorage.getItem('upstash_token');
        if (!url || !token) return;
        const res = await fetch(`${url}/get/cycle_data`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await res.json();
        if (data.result) {
            trackingData = new Map(Object.entries(JSON.parse(data.result)));
            render();
        }
    }

    // --- APP LOGIC ---
    function openSettings() {
        document.getElementById('dial-content').innerHTML = `
            <h3>Cloud Sync</h3>
            <input id="in-url" placeholder="Upstash URL" value="${localStorage.getItem('upstash_url')||''}">
            <input id="in-token" placeholder="Upstash Token" value="${localStorage.getItem('upstash_token')||''}">
            <button onclick="saveSettings()">Save & Sync</button>
        `;
        document.getElementById('overlay').style.display = 'flex';
    }

    function saveSettings() {
        localStorage.setItem('upstash_url', document.getElementById('in-url').value);
        localStorage.setItem('upstash_token', document.getElementById('in-token').value);
        document.getElementById('overlay').style.display = 'none';
        loadFromCloud();
    }

    function render() {
        list.innerHTML = '';
        let d = new Date();
        for(let i=0; i<6; i++) {
            let container = document.createElement('div');
            container.className = 'month-container';
            container.innerHTML = `<div class="month-header">${d.toLocaleString('default', {month:'long', year:'numeric'})}</div>`;
            let grid = document.createElement('div'); grid.className = 'calendar-grid';
            let daysInMonth = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate();
            for(let day=1; day<=daysInMonth; day++) {
                let cell = document.createElement('div'); cell.className = 'day'; cell.innerText = day;
                cell.onclick = () => alert('Logged day ' + day);
                grid.appendChild(cell);
            }
            container.appendChild(grid); list.appendChild(container);
            d.setMonth(d.getMonth()+1);
        }
    }

    render();
    loadFromCloud();
</script>
</body>
</html>
