<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cycle Tracker</title>
    <style>
        :root {
            --bg-color: #000;
            --text-color: #fff;
            --cell-border: #222;
            --highlight-red: #ff4d4d33;
            --blood-color: #ff4d4d;
            --pill-color: #4da6ff;
            --faint-text: #666;
            --accent: #ffffff;
            --predict-color: #ff4d4d88;
        }
        body { background-color: var(--bg-color); color: var(--text-color); font-family: -apple-system, sans-serif; margin: 0; overflow: hidden; }
        .nav-bar { position: fixed; top: 0; width: 100%; height: 75px; background: rgba(0,0,0,0.85); backdrop-filter: blur(15px); display: flex; flex-direction: column; justify-content: center; padding: 0 20px; z-index: 100; box-sizing: border-box; border-bottom: 1px solid var(--cell-border); }
        .nav-content { display: flex; justify-content: space-between; align-items: center; }
        #prediction-text { font-size: 0.75rem; color: var(--blood-color); margin-top: 4px; font-weight: 500; }
        #jump-btn { background: #fff; color: #000; border: none; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; font-weight: bold; }
        
        #scroll-viewport { height: 100vh; overflow-y: auto; scroll-behavior: smooth; padding-top: 75px; }
        .month-container { padding: 10px 15px 40px 15px; max-width: 500px; margin: 0 auto; }
        .month-header { font-size: 1.4rem; font-weight: 700; padding: 20px 0; position: sticky; top: 0; background: var(--bg-color); z-index: 5; }
        
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); border-top: 1px solid var(--cell-border); border-left: 1px solid var(--cell-border); }
        .weekday-label { text-align: center; font-size: 0.6rem; color: var(--faint-text); padding: 10px 0; text-transform: uppercase; border-bottom: 1px solid var(--cell-border); border-right: 1px solid var(--cell-border); }
        .day { aspect-ratio: 1 / 1; border-right: 1px solid var(--cell-border); border-bottom: 1px solid var(--cell-border); position: relative; cursor: pointer; }
        .day.is-today { box-shadow: inset 0 0 0 2px var(--accent); z-index: 2; }
        .day.is-predicted { border: 1.5px dashed var(--predict-color); z-index: 1; }
        
        .date-num { position: absolute; top: 8px; left: 10px; font-size: 0.95rem; }
        .icon-stack { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
        .mini-pixel { width: 6px; height: 6px; border-radius: 50%; }
        .pixel-blood { background-color: var(--blood-color); }
        .pixel-pill { background-color: var(--pill-color); }
        .day.period-active { background-color: var(--highlight-red); }
        
        #overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 200; justify-content: center; align-items: center; }
        .dial { background: #111; padding: 25px; border-radius: 28px; display: flex; flex-direction: column; gap: 10px; border: 1px solid #333; width: 280px; }
        .dial-section-title { font-size: 0.8rem; color: #888; text-transform: uppercase; margin-top: 10px; padding-left: 5px; }
        .dial-btn { background: #222; border: 1px solid #444; color: white; padding: 14px; border-radius: 12px; cursor: pointer; text-align: left; font-size: 0.95rem; display: flex; justify-content: space-between; align-items: center; }
        .dial-btn.active { border-color: var(--blood-color); background: #331a1a; }
        .dial-btn.pill-active { border-color: var(--pill-color); background: #1a2633; }
        
        #bottom-sentinel, #top-sentinel { height: 100px; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div class="nav-content">
        <div style="font-weight: 800; font-size: 1.1rem; letter-spacing: -0.5px;">TRACKER</div>
        <button id="jump-btn" onclick="jumpToToday()">Jump to Today</button>
    </div>
    <div id="prediction-text">Log flow to start 6-month prediction</div>
</div>

<div id="scroll-viewport">
    <div id="top-sentinel"></div>
    <div id="calendar-list"></div>
    <div id="bottom-sentinel"></div>
</div>

<div id="overlay">
    <div class="dial" id="dial-content"></div>
</div>

<script>
    const calendarList = document.getElementById('calendar-list');
    const viewport = document.getElementById('scroll-viewport');
    const predictLabel = document.getElementById('prediction-text');
    const dialContent = document.getElementById('dial-content');
    
    let trackingData = new Map();
    let predictedDates = new Set();
    let selectedDateKey = null;
    
    const today = new Date();
    const todayKey = `${today.getFullYear()}-${today.getMonth() + 1}-${today.getDate()}`;
    
    let futureCursor = new Date(today.getFullYear(), today.getMonth(), 1);
    let pastCursor = new Date(today.getFullYear(), today.getMonth(), 1);

    function saveData() {
        localStorage.setItem('cycle_tracker_data', JSON.stringify(Object.fromEntries(trackingData)));
        refreshAppView();
    }

    function loadData() {
        const saved = localStorage.getItem('cycle_tracker_data');
        if (saved) trackingData = new Map(Object.entries(JSON.parse(saved)));
        refreshAppView();
    }

    // --- ENHANCED PREDICTION LOGIC ---
    function updatePredictions() {
        predictedDates.clear();
        let latestPeriodStart = null;
        const sortedDates = Array.from(trackingData.keys()).sort((a, b) => new Date(a) - new Date(b));
        
        for (let i = 0; i < sortedDates.length; i++) {
            const currentKey = sortedDates[i];
            const data = trackingData.get(currentKey);
            const hasFlow = data.heavy || data.medium || data.light || data.spotting;
            
            if (hasFlow) {
                const prevDate = new Date(currentKey);
                prevDate.setDate(prevDate.getDate() - 1);
                const prevKey = `${prevDate.getFullYear()}-${prevDate.getMonth() + 1}-${prevDate.getDate()}`;
                const prevData = trackingData.get(prevKey);
                const prevHadFlow = prevData && (prevData.heavy || prevData.medium || prevData.light || prevData.spotting);
                
                if (!prevHadFlow) latestPeriodStart = new Date(currentKey);
            }
        }

        if (latestPeriodStart) {
            // Predict 6 cycles ahead
            for (let cycle = 1; cycle <= 6; cycle++) {
                const cycleStart = new Date(latestPeriodStart);
                cycleStart.setDate(cycleStart.getDate() + (28 * cycle));
                
                // Highlight a 4-day predicted window for each future cycle
                for (let day = 0; day < 4; day++) {
                    const p = new Date(cycleStart);
                    p.setDate(p.getDate() + day);
                    predictedDates.add(`${p.getFullYear()}-${p.getMonth() + 1}-${p.getDate()}`);
                }
                
                if (cycle === 1) {
                    predictLabel.innerText = `Next period: ${cycleStart.toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}`;
                }
            }
        }
    }

    function refreshAppView() {
        updatePredictions();
        document.querySelectorAll('.day').forEach(day => {
            if (day.id.startsWith('cell-')) {
                const k = day.id.replace('cell-', '');
                const d = k.split('-')[2];
                const data = trackingData.get(k) || { heavy: false, medium: false, light: false, spotting: false, pill: false };
                renderDayContent(day, d, data);
            }
        });
    }

    function createMonthGrid(dateObj) {
        const year = dateObj.getFullYear();
        const month = dateObj.getMonth();
        const container = document.createElement('div');
        container.className = 'month-container';
        container.innerHTML = `<div class="month-header">${dateObj.toLocaleString('default', { month: 'long', year: 'numeric' })}</div>`;

        const grid = document.createElement('div');
        grid.className = 'calendar-grid';
        ['S','M','T','W','T','F','S'].forEach(day => grid.innerHTML += `<div class="weekday-label">${day}</div>`);

        const firstDay = new Date(year, month, 1).getDay();
        const daysInMonth = new Date(year, month + 1, 0).getDate();

        for (let i = 0; i < firstDay; i++) grid.appendChild(Object.assign(document.createElement('div'), { className: 'day empty' }));

        for (let d = 1; d <= daysInMonth; d++) {
            const dateKey = `${year}-${month + 1}-${d}`;
            const data = trackingData.get(dateKey) || { heavy: false, medium: false, light: false, spotting: false, pill: false };
            const dayDiv = document.createElement('div');
            dayDiv.id = `cell-${dateKey}`;
            dayDiv.onclick = () => openDial(dateKey);
            renderDayContent(dayDiv, d, data);
            grid.appendChild(dayDiv);
        }
        container.appendChild(grid);
        return container;
    }

    function renderDayContent(element, dayNum, data) {
        const dateKey = element.id.replace('cell-', '');
        const hasAnyFlow = data.heavy || data.medium || data.light || data.spotting;
        
        element.innerHTML = `
            <span class="date-num">${dayNum}</span>
            <div class="icon-stack">
                ${hasAnyFlow ? '<div class="mini-pixel pixel-blood"></div>' : ''}
                ${data.pill ? '<div class="mini-pixel pixel-pill"></div>' : ''}
            </div>
        `;
        
        if (dateKey === todayKey) element.classList.add('is-today');
        if (hasAnyFlow) element.classList.add('period-active'); else element.classList.remove('period-active');
        if (predictedDates.has(dateKey)) element.classList.add('is-predicted'); else element.classList.remove('is-predicted');
    }

    function loadMore(direction) {
        if (direction === 'future') {
            calendarList.appendChild(createMonthGrid(new Date(futureCursor)));
            futureCursor.setMonth(futureCursor.getMonth() + 1);
        } else {
            pastCursor.setMonth(pastCursor.getMonth() - 1);
            const monthEl = createMonthGrid(new Date(pastCursor));
            calendarList.prepend(monthEl);
            viewport.scrollTop += monthEl.offsetHeight;
        }
    }

    function jumpToToday() {
        const target = document.getElementById(`cell-${todayKey}`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }

    const observer = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
            if (entry.isIntersecting) {
                if (entry.target.id === 'bottom-sentinel') loadMore('future');
                if (entry.target.id === 'top-sentinel') loadMore('past');
            }
        });
    }, { root: viewport, threshold: 0.1 });

    observer.observe(document.getElementById('bottom-sentinel'));
    observer.observe(document.getElementById('top-sentinel'));

    function openDial(dateKey) {
        selectedDateKey = dateKey;
        const data = trackingData.get(dateKey) || { heavy: false, medium: false, light: false, spotting: false, pill: false };
        dialContent.innerHTML = `
            <div class="dial-section-title">Log 🩸</div>
            <button class="dial-btn ${data.heavy ? 'active' : ''}" onclick="toggleData('heavy')">Heavy ${data.heavy ? '✓' : ''}</button>
            <button class="dial-btn ${data.medium ? 'active' : ''}" onclick="toggleData('medium')">Medium ${data.medium ? '✓' : ''}</button>
            <button class="dial-btn ${data.light ? 'active' : ''}" onclick="toggleData('light')">Light ${data.light ? '✓' : ''}</button>
            <button class="dial-btn ${data.spotting ? 'active' : ''}" onclick="toggleData('spotting')">Spotting ${data.spotting ? '✓' : ''}</button>
            <div class="dial-section-title">Medication</div>
            <button class="dial-btn ${data.pill ? 'pill-active' : ''}" onclick="toggleData('pill')">💊 Birth Control ${data.pill ? '✓' : ''}</button>
            <button class="dial-btn" style="background:transparent; border:none; color:#888; justify-content:center; margin-top:10px" onclick="closeDial()">Dismiss</button>
        `;
        document.getElementById('overlay').style.display = 'flex';
    }

    function closeDial() { document.getElementById('overlay').style.display = 'none'; }

    function toggleData(type) {
        const current = trackingData.get(selectedDateKey) || { heavy: false, medium: false, light: false, spotting: false, pill: false };
        if (['heavy', 'medium', 'light', 'spotting'].includes(type)) {
            const wasActive = current[type];
            current.heavy = current.medium = current.light = current.spotting = false;
            current[type] = !wasActive;
        } else {
            current[type] = !current[type];
        }
        trackingData.set(selectedDateKey, current);
        saveData();
        openDial(selectedDateKey);
    }

    loadData();
    for(let i=0; i<8; i++) loadMore('future'); // Pre-load 8 months for smooth scrolling
    window.onload = () => setTimeout(jumpToToday, 200);
</script>
</body>
</html>
