<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Cycle Tracker</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; }
        .nav-bar { position: fixed; top: 0; width: 100%; height: 60px; background: #111; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; box-sizing: border-box; }
        #calendar-list { padding-top: 70px; }
        .month-header { padding: 20px; font-weight: bold; }
        .grid { display: grid; grid-template-columns: repeat(7, 1fr); }
        .day { aspect-ratio: 1; border: 0.5px solid #333; display: flex; align-items: center; justify-content: center; font-size: 0.8rem; }
        #overlay { display: none; position: fixed; top:0; left:0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 99; justify-content: center; align-items: center; }
        .dial { background: #222; padding: 20px; border-radius: 15px; width: 80%; }
        input { width: 100%; padding: 10px; margin: 5px 0; background: #000; color: #fff; border: 1px solid #444; }
    </style>
</head>
<body>

<div class="nav-bar">
    <div>CYCLE TRACKER</div>
    <div onclick="document.getElementById('overlay').style.display='flex'">⚙️</div>
</div>

<div id="scroll-viewport"><div id="calendar-list"></div></div>

<div id="overlay" onclick="this.style.display='none'">
    <div class="dial" onclick="event.stopPropagation()">
        <input id="in-url" placeholder="Upstash URL">
        <input id="in-token" placeholder="Upstash Token">
        <button onclick="saveSettings()">Save & Refresh</button>
    </div>
</div>

<script>
    let trackingData = new Map();
    const list = document.getElementById('calendar-list');

    function renderCalendar() {
        list.innerHTML = '';
        const now = new Date();
        const grid = document.createElement('div');
        grid.className = 'grid';
        for(let i=1; i<=30; i++) {
            const d = document.createElement('div');
            d.className = 'day'; d.innerText = i;
            grid.appendChild(d);
        }
        list.appendChild(grid);
    }

    async function saveSettings() {
        localStorage.setItem('upstash_url', document.getElementById('in-url').value);
        localStorage.setItem('upstash_token', document.getElementById('in-token').value);
        document.getElementById('overlay').style.display = 'none';
        alert('Settings saved. Refreshing...');
        location.reload();
    }

    renderCalendar();
</script>
</body>
</html>
